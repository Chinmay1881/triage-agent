[project]
name = "triage-agent-backend"
version = "0.1.0"
description = "SOC triage agent: read-only investigation tools, LangGraph agent, FastAPI API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.8",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.19,<1.3",
    "mitreattack-python>=6.3.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.6.0",
    "stix2>=3.0.2",
    "uvicorn>=0.54.0",
]

# Not a distributable package: code lives in app/ and runs from this directory.
[tool.uv]
package = false

[tool.pytest.ini_options]
# ".." makes scripts/ and scenarios/ importable for the generator tests.
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["mongo: needs the MongoDB container from `python tasks.py up`"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]
